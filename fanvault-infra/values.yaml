# ═══════════════════════════════════════════════════════════════════════
#  gateway sub-chart values
# ═══════════════════════════════════════════════════════════════════════
gateway:
  namespace: dev
  name: fanvault-gateway
  role: dev-gateway
  gatewayClassName: kgateway
  listenerPort: 80


  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
    targetCPUUtilizationPercentage: 70

  # All HTTPRoutes defined here – rendered as a single multi-document YAML
  routes:
    - name: auth-route
      pathPrefix: /api/auth
      serviceName: auth-service
      servicePort: 3001
    - name: user-route
      pathPrefix: /api/users
      serviceName: user-service
      servicePort: 3002
    - name: product-route
      pathPrefix: /api/products
      serviceName: product-service
      servicePort: 3003
    - name: order-route
      pathPrefix: /api/orders
      serviceName: order-service
      servicePort: 3004
    - name: email-route
      pathPrefix: /api/email
      serviceName: email-service
      servicePort: 3005
    - name: frontend-route
      pathPrefix: /
      serviceName: frontend
      servicePort: 80

# ═══════════════════════════════════════════════════════════════════════
#  MongoDB – local isolated StatefulSets
# ═══════════════════════════════════════════════════════════════════════
mongodb:
  namespace: dev
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  auth:
    rootUser: root
    rootPassword: "root123"
  port: 27017
  podLabels:
    role: dev-db
    app.kubernetes.io/part-of: fanvault
  persistence:
    storageClass: "nfs-storage"
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  instances:
    - name: auth-mongodb
      database: auth-db
    - name: user-mongodb
      database: user-db
    - name: product-mongodb
      database: product-db
    - name: order-mongodb
      database: order-db

# ═══════════════════════════════════════════════════════════════════════
#  RabbitMQ – local shared StatefulSet
# ═══════════════════════════════════════════════════════════════════════
rabbitmq:
  fullnameOverride: rabbitmq

  auth:
    username: root
    password: "root123"
    erlangCookie: "FanVaultRabbitMQSecretCookie2025"
    vhost: /

  image:
    repository: rabbitmq
    tag: "3.13-management"
    pullPolicy: IfNotPresent

  replicaCount: 1

  # Add role label so NetworkPolicy podSelector works
  podLabels:
    role: dev-db
    app.kubernetes.io/part-of: fanvault

  service:
    type: ClusterIP
    port: 5672
    managerPort: 15672

  persistence:
    enabled: true
    storageClass: "nfs-storage"
    accessMode: ReadWriteOnce
    size: 4Gi

  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

  pdb:
    create: true
    minAvailable: 1

  readinessProbe:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
    failureThreshold: 6

  livenessProbe:
    initialDelaySeconds: 120
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 6

  extraConfiguration: |
    deprecated_features.permit.management_metrics_collection = true
    default_permissions.configure = .*
    default_permissions.read = .*
    default_permissions.write = .*
