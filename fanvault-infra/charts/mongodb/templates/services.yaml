{{- $namespace := .Values.namespace | default .Release.Namespace -}}
{{- $port := .Values.port | default 27017 -}}
{{- range .Values.instances }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .name }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: mongodb
    app.kubernetes.io/part-of: {{ $.Values.global.partOf | default "fanvault" }}
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  clusterIP: None
  publishNotReadyAddresses: true
  ports:
    - name: mongodb
      port: {{ $port }}
      targetPort: mongodb
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/component: mongodb
{{- end }}
