# ═══════════════════════════════════════════════════════════════════════
#  Gateway Sub-Chart Values
#  Inherits global.gateway.* from parent chart
# ═══════════════════════════════════════════════════════════════════════

# Default values that can be overridden at chart deployment level
namespace: dev
name: fanvault-gateway
role: dev-gateway

# Gateway configuration – should match global.gateway.gatewayClassName
# The GatewayClass is created in the template using lookup and global values
gatewayClassName: kgateway  # Must match global.gateway.gatewayClassName

listenerPort: 80

# HTTP Routes handled by this gateway
# Routed to backend services in the dev namespace
routes:
  - name: auth-route
    pathPrefix: /api/auth
    serviceName: auth-service
    servicePort: 3001
  - name: user-route
    pathPrefix: /api/users
    serviceName: user-service
    servicePort: 3002
  - name: product-route
    pathPrefix: /api/products
    serviceName: product-service
    servicePort: 3003
  - name: order-route
    pathPrefix: /api/orders
    serviceName: order-service
    servicePort: 3004
  - name: email-route
    pathPrefix: /api/email
    serviceName: email-service
    servicePort: 3005
  - name: frontend-route
    pathPrefix: /
    serviceName: frontend
    servicePort: 80

# Horizontal Pod Autoscaler for gateway
hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 70
