# ══════════════════════════════════════════════════════════════════════════════
#  fanvault-infra – Values for PROD environment
#  Branch:    main  (ArgoCD watches main branch for prod)
#  Namespace: prod
# ══════════════════════════════════════════════════════════════════════════════
global:
  namespace: prod
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent
  partOf: fanvault
  gateway:
    gatewayClassName: kgateway
    controllerName: kgateway.dev/kgateway
    deployGatewayClass: false

backend-common:
  namespace: prod
  partOf: fanvault
  services:
    auth-service:
      role: prod-backend
      port: 3001
      config:
        PORT: "3001"
        NODE_ENV: "production"
        SERVICE_NAME: "auth-service"
        JWT_EXPIRES_IN: "15m"
        JWT_REFRESH_EXPIRES_IN: "7d"
      secret:
        MONGO_URI: "mongodb://root:root123@auth-mongodb.prod.svc.cluster.local:27017/auth-db?authSource=admin"
        JWT_SECRET: "0b849786adec5efb97547d99e6d76438cf37559eee750d23261abf614456a7dd0d07bb3d59560c20df4ece773a398b13"
        JWT_REFRESH_SECRET: "bf47b713587fa9c4a048e82a1f0051a12eda45094ef0bdb22dfcfdd19b441e8f88975d48019f83ecd1dc52426e074f1c"

    user-service:
      role: prod-backend
      port: 3002
      config:
        PORT: "3002"
        NODE_ENV: "production"
        SERVICE_NAME: "user-service"
      secret:
        MONGO_URI: "mongodb://root:root123@user-mongodb.prod.svc.cluster.local:27017/user-db?authSource=admin"
        JWT_SECRET: "0b849786adec5efb97547d99e6d76438cf37559eee750d23261abf614456a7dd0d07bb3d59560c20df4ece773a398b13"
        INTERNAL_SECRET: "d742b8e49bb41080791928716d5b426bf135907ff3a5b7bcf7e89b5012b089d4"

    product-service:
      role: prod-backend
      port: 3003
      config:
        PORT: "3003"
        NODE_ENV: "production"
        SERVICE_NAME: "product-service"
      secret:
        MONGO_URI: "mongodb://root:root123@product-mongodb.prod.svc.cluster.local:27017/product-db?authSource=admin"
        JWT_SECRET: "0b849786adec5efb97547d99e6d76438cf37559eee750d23261abf614456a7dd0d07bb3d59560c20df4ece773a398b13"

    order-service:
      role: prod-backend
      port: 3004
      config:
        PORT: "3004"
        NODE_ENV: "production"
        SERVICE_NAME: "order-service"
        EMAIL_SERVICE_URL: "http://email-service.prod.svc.cluster.local:3005"
      secret:
        MONGO_URI: "mongodb://root:root123@order-mongodb.prod.svc.cluster.local:27017/order-db?authSource=admin"
        RABBITMQ_URL: "amqp://root:root123@rabbitmq.prod.svc.cluster.local:5672"
        JWT_SECRET: "0b849786adec5efb97547d99e6d76438cf37559eee750d23261abf614456a7dd0d07bb3d59560c20df4ece773a398b13"
        INTERNAL_SECRET: "d742b8e49bb41080791928716d5b426bf135907ff3a5b7bcf7e89b5012b089d4"

    email-service:
      role: prod-backend
      port: 3005
      config:
        PORT: "3005"
        NODE_ENV: "production"
        SERVICE_NAME: "email-service"
        SMTP_HOST: "smtp.gmail.com"
        SMTP_PORT: "587"
        SMTP_SECURE: "false"
        SMTP_FROM: "FanVault Store <jayabaaskar@gmail.com>"
      secret:
        RABBITMQ_URL: "amqp://root:root123@rabbitmq.prod.svc.cluster.local:5672"
        INTERNAL_SECRET: "d742b8e49bb41080791928716d5b426bf135907ff3a5b7bcf7e89b5012b089d4"
        SMTP_USER: "jayabaaskar@gmail.com"
        SMTP_PASS: "moefitmxbruudot"

    frontend:
      role: prod-frontend
      port: 80
      config:
        NODE_ENV: "production"
        API_BASE_URL: "http://fanvault-gateway.prod.svc.cluster.local"
      secret: {}

gateway:
  namespace: prod
  name: fanvault-gateway
  role: prod-gateway
  gatewayClassName: kgateway
  listenerPort: 80
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70
  routes:
    - name: auth-route
      pathPrefix: /api/auth
      serviceName: auth-service
      servicePort: 3001
    - name: user-route
      pathPrefix: /api/users
      serviceName: user-service
      servicePort: 3002
    - name: product-route
      pathPrefix: /api/products
      serviceName: product-service
      servicePort: 3003
    - name: order-route
      pathPrefix: /api/orders
      serviceName: order-service
      servicePort: 3004
    - name: email-route
      pathPrefix: /api/email
      serviceName: email-service
      servicePort: 3005
    - name: frontend-route
      pathPrefix: /
      serviceName: frontend
      servicePort: 80

mongodb:
  namespace: prod
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  auth:
    rootUser: root
    rootPassword: "root123"
  port: 27017
  podLabels:
    role: prod-db
    app.kubernetes.io/part-of: fanvault
  persistence:
    storageClass: "nfs-storage"
    accessModes:
      - ReadWriteOnce
    size: 8Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  instances:
    - name: auth-mongodb
      database: auth-db
    - name: user-mongodb
      database: user-db
    - name: product-mongodb
      database: product-db
    - name: order-mongodb
      database: order-db

rabbitmq:
  namespace: prod
  fullnameOverride: rabbitmq
  auth:
    username: root
    password: "root123"
    erlangCookie: "FanVaultRabbitMQDevCookie2025"
    vhost: /
  image:
    repository: rabbitmq
    tag: "3.13-management"
    pullPolicy: IfNotPresent
  replicaCount: 3
  podLabels:
    role: prod-db
    app.kubernetes.io/part-of: fanvault
  service:
    type: ClusterIP
    port: 5672
    managerPort: 15672
  persistence:
    enabled: true
    storageClass: "nfs-storage"
    accessMode: ReadWriteOnce
    size: 4Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
