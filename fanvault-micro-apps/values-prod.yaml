# ══════════════════════════════════════════════════════════════════════════════
#  fanvault-micro-apps – Values for PROD environment
#  Branch:    main  |  Namespace: prod
#  NOTE: image.tag is updated automatically by the CI helm-updater job
# ══════════════════════════════════════════════════════════════════════════════
global:
  namespace: prod
  imageRegistry: docker.io
  imagePullPolicy: IfNotPresent
  partOf: fanvault

# ── Per-service overrides for prod ───────────────────────────────────────────
auth-service:
  namespace: prod
  replicaCount: 1
  role: prod-backend
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "200Mi"

user-service:
  namespace: prod
  replicaCount: 1
  role: prod-backend
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "200Mi"

product-service:
  namespace: prod
  replicaCount: 1
  role: prod-backend
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "200Mi"

order-service:
  namespace: prod
  replicaCount: 1
  role: prod-backend
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "20m"
      memory: "64Mi"
    limits:
      cpu: "150m"
      memory: "200Mi"

email-service:
  namespace: prod
  replicaCount: 1
  role: prod-backend
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "75m"
      memory: "128Mi"

frontend:
  namespace: prod
  replicaCount: 1
  role: prod-frontend
  image:
    tag: v0.0.1
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "10m"
      memory: "32Mi"
    limits:
      cpu: "75m"
      memory: "64Mi"
