  namespace: dev
  replicaCount: 1
  image:
    pullPolicy: Always

email-service:
  namespace: dev
  replicaCount: 1
  image:
    pullPolicy: Always

frontend:
  namespace: dev
  replicaCount: 1
  image:
    pullPolicy: Always
